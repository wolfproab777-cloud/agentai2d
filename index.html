<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>2D Pixel Real-time AI Office</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { background: #121218; color: #fff; font-family: monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        #canvas-container { position: relative; border: 4px solid #444; }
        canvas { background: #c2a679; image-rendering: pixelated; display: block; }
        #chat-interface { margin-top: 10px; width: 640px; display: flex; gap: 10px; }
        input { flex: 1; padding: 10px; background: #222; border: 1px solid #555; color: #fff; }
        button { padding: 10px 20px; background: #007acc; color: #fff; border: none; cursor: pointer; }
        #dialog-box { position: absolute; bottom: 10px; left: 10px; right: 10px; background: rgba(0,0,0,0.85); border: 2px solid #00d2ff; padding: 10px; font-size: 13px; max-height: 100px; overflow-y: auto; }
    </style>
</head>
<body>

<h1>2D PIXEL REAL-TIME AI OFFICE</h1>
<div id="canvas-container">
    <canvas id="office" width="640" height="360"></canvas>
    <div id="dialog-box">
        <b id="agent-name">Agent tanlang</b>
        <p id="agent-text">Har bir agent alohida AI modeliga ulangan (Gemini, ChatGPT, Claude).</p>
    </div>
</div>

<div id="chat-interface">
    <input type="text" id="userInput" placeholder="Agentga savol bering...">
    <button onclick="sendPrompt()">Yuborish</button>
</div>

<script>
const socket = io();
const canvas = document.getElementById('office');
const ctx = canvas.getContext('2d');

let selectedAgent = 1;

const agents = [
    { id: 1, name: "Gemini Bot", model: "gemini", color: "#4285F4", x: 120, y: 150, text: "Salom! Men Gemini AI man." },
    { id: 2, name: "ChatGPT Bot", model: "chatgpt", color: "#10a37f", x: 320, y: 150, text: "Salom! Men ChatGPT AI man." },
    { id: 3, name: "Claude Bot", model: "claude", color: "#d97706", x: 520, y: 150, text: "Salom! Men Claude AI man." }
];

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    // Pol va xona
    ctx.fillStyle = '#b59363';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#333';
    ctx.fillRect(0, 0, canvas.width, 30);

    // Agentlarni chizish
    agents.forEach(a => {
        // Stol
        ctx.fillStyle = '#5c3a1e';
        ctx.fillRect(a.x - 30, a.y - 10, 60, 30);
        
        // Kompyuter
        ctx.fillStyle = '#111';
        ctx.fillRect(a.x - 10, a.y - 25, 20, 15);

        // Agent (Piksel)
        ctx.fillStyle = a.color;
        ctx.fillRect(a.x - 8, a.y - 40, 16, 16);

        // Tanlangan agent effekti
        if(a.id === selectedAgent) {
            ctx.strokeStyle = '#fff';
            ctx.strokeRect(a.x - 10, a.y - 42, 20, 20);
        }

        ctx.fillStyle = '#fff';
        ctx.font = '10px monospace';
        ctx.textAlign = 'center';
        ctx.fillText(a.name, a.x, a.y - 48);
    });

    requestAnimationFrame(draw);
}
draw();

canvas.addEventListener('click', (e) => {
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;

    agents.forEach(a => {
        if (Math.abs(a.x - x) < 30 && Math.abs(a.y - y) < 30) {
            selectedAgent = a.id;
            document.getElementById('agent-name').innerText = `${a.name} (${a.model.toUpperCase()})`;
            document.getElementById('agent-text').innerText = a.text;
        }
    });
});

function sendPrompt() {
    const input = document.getElementById('userInput');
    if (!input.value) return;

    const currentAgent = agents.find(a => a.id === selectedAgent);
    
    document.getElementById('agent-text').innerText = "AI javob tayyorlamoqda...";

    socket.emit('ask_agent', {
        agentId: currentAgent.id,
        model: currentAgent.model,
        prompt: input.value
    });

    input.value = '';
}

socket.on('agent_status', (data) => {
    if (data.agentId === selectedAgent) {
        document.getElementById('agent-text').innerText = data.status;
    }
});

socket.on('agent_response', (data) => {
    const agent = agents.find(a => a.id === data.agentId);
    if (agent) {
        agent.text = data.text;
        if (agent.id === selectedAgent) {
            document.getElementById('agent-text').innerText = data.text;
        }
    }
});
</script>
</body>
</html>

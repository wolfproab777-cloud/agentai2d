<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>2D Pixel AI RPG Office</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { background: #0b0f19; color: #fff; font-family: 'Segoe UI', monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        h1 { margin: 8px 0; font-size: 18px; color: #38bdf8; text-transform: uppercase; letter-spacing: 2px; }
        .controls-hint { font-size: 12px; color: #94a3b8; margin-bottom: 8px; }
        #canvas-container { position: relative; border: 4px solid #1e293b; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        canvas { background: #0f172a; image-rendering: pixelated; display: block; border-radius: 4px; }
        #chat-interface { margin-top: 10px; width: 800px; display: flex; gap: 10px; }
        input { flex: 1; padding: 12px; background: #1e293b; border: 2px solid #334155; border-radius: 6px; color: #fff; font-size: 14px; outline: none; }
        input:focus { border-color: #38bdf8; }
        button { padding: 12px 24px; background: #0284c7; color: #fff; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; }
        button:hover { background: #0369a1; }
        #dialog-box { position: absolute; bottom: 10px; left: 10px; right: 10px; background: rgba(15, 23, 42, 0.95); border: 2px solid #38bdf8; border-radius: 6px; padding: 10px; font-size: 13px; max-height: 80px; overflow-y: auto; }
    </style>
</head>
<body>

<h1>2D Pixel AI Office RPG</h1>
<div class="controls-hint">Boshqarish: <b>W, A, S, D</b> yoki <b>Yo'nalish tugmalari (Streлкаlar)</b> orqali yuring. AI stoliga yaqinlashing!</div>

<div id="canvas-container">
    <canvas id="office" width="800" height="420"></canvas>
    <div id="dialog-box">
        <b id="agent-name" style="color:#38bdf8;">Tizim</b>
        <p id="agent-text" style="margin: 4px 0 0 0;">Qahramoningizni harakatlantirib, AI agentlaridan birining stoliga yaqin bering...</p>
    </div>
</div>

<div id="chat-interface">
    <input type="text" id="userInput" placeholder="Yaqindagi AI agentiga savol yuboring...">
    <button onclick="sendPrompt()">Yuborish</button>
</div>

<script>
const socket = io();
const canvas = document.getElementById('office');
const ctx = canvas.getContext('2d');

let activeAgent = null;

// Qahramon (Player) obyekti
const player = {
    x: 400,
    y: 350,
    size: 16,
    speed: 4,
    color: '#facc15'
};

const keys = {};

// AI Agentlar stollari
const agents = [
    { id: 1, name: "Gemini AI", model: "gemini", color: "#4285F4", x: 150, y: 180, text: "Salom! Men Gemini-man. Meni yonimga kelib savol bering." },
    { id: 2, name: "ChatGPT 4o", model: "chatgpt", color: "#10a37f", x: 400, y: 180, text: "Salom! Men ChatGPT-man. Kod yoki matnlar bo'yicha yordam beraman." },
    { id: 3, name: "Claude 3.5", model: "claude", color: "#d97706", x: 650, y: 180, text: "Salom! Men Claude-man. Murakkab mantiqiy savollaringizni kutaman." }
];

window.addEventListener('keydown', e => keys[e.key] = true);
window.addEventListener('keyup', e => keys[e.key] = false);

function updatePlayer() {
    if ((keys['w'] || keys['W'] || keys['ArrowUp']) && player.y > 115) player.y -= player.speed;
    if ((keys['s'] || keys['S'] || keys['ArrowDown']) && player.y < canvas.height - 20) player.y += player.speed;
    if ((keys['a'] || keys['A'] || keys['ArrowLeft']) && player.x > 20) player.x -= player.speed;
    if ((keys['d'] || keys['D'] || keys['ArrowRight']) && player.x < canvas.width - 20) player.x += player.speed;

    // Eng yaqin agentni aniqlash
    let found = null;
    agents.forEach(a => {
        const dist = Math.hypot(player.x - a.x, player.y - a.y);
        if (dist < 70) {
            found = a;
        }
    });

    if (found !== activeAgent) {
        activeAgent = found;
        if (activeAgent) {
            document.getElementById('agent-name').innerText = `${activeAgent.name} (${activeAgent.model.toUpperCase()})`;
            document.getElementById('agent-text').innerText = activeAgent.text;
        } else {
            document.getElementById('agent-name').innerText = "Tizim";
            document.getElementById('agent-text').innerText = "AI bilan muloqot qilish uchun uning stoliga yaqinlashing.";
        }
    }
}

function drawGame() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Devor va Pol
    ctx.fillStyle = '#1e293b'; ctx.fillRect(0, 0, canvas.width, 100);
    ctx.fillStyle = '#b45309'; ctx.fillRect(0, 100, canvas.width, canvas.height - 100); // Yog'och pol

    // Oynalar
    [80, 340, 600].forEach(wx => {
        ctx.fillStyle = '#0284c7'; ctx.fillRect(wx, 20, 100, 50);
    });

    // AI Agentlar va ularning stollari
    agents.forEach(a => {
        // Zonalarni belgilash
        ctx.strokeStyle = (activeAgent && activeAgent.id === a.id) ? '#38bdf8' : 'rgba(255,255,255,0.1)';
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(a.x, a.y, 50, 0, Math.PI * 2); ctx.stroke();

        // Stol va Monitor
        ctx.fillStyle = '#334155'; ctx.fillRect(a.x - 40, a.y - 15, 80, 30);
        ctx.fillStyle = '#0f172a'; ctx.fillRect(a.x - 15, a.y - 30, 30, 15);
        ctx.fillStyle = a.color; ctx.fillRect(a.x - 12, a.y - 28, 24, 11);

        // Ismi
        ctx.fillStyle = '#ffffff'; ctx.font = '11px monospace'; ctx.textAlign = 'center';
        ctx.fillText(a.name, a.x, a.y - 40);
    });

    // Player (O'yinchi qahramoni)
    ctx.fillStyle = player.color;
    ctx.beginPath(); ctx.arc(player.x, player.y, player.size, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#000'; // Ko'zlar
    ctx.fillRect(player.x - 4, player.y - 4, 3, 3);
    ctx.fillRect(player.x + 2, player.y - 4, 3, 3);
}

function gameLoop() {
    updatePlayer();
    drawGame();
    requestAnimationFrame(gameLoop);
}

gameLoop();

function sendPrompt() {
    const input = document.getElementById('userInput');
    if (!input.value) return;

    if (!activeAgent) {
        alert("Iltimos, avval biror AI agentining stoliga yaqinlashing!");
        return;
    }

    document.getElementById('agent-text').innerText = "AI javob o'ylamoqda...";

    socket.emit('ask_agent', {
        agentId: activeAgent.id,
        model: activeAgent.model,
        prompt: input.value
    });

    input.value = '';
}

socket.on('agent_response', (data) => {
    const agent = agents.find(a => a.id === data.agentId);
    if (agent) {
        agent.text = data.text;
        if (activeAgent && activeAgent.id === data.agentId) {
            document.getElementById('agent-text').innerText = data.text;
        }
    }
});
</script>
</body>
</html>
